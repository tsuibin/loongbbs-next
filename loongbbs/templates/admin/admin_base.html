<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
<meta http-equiv="MSThemeCompatible" content="Yes">
<link rel="stylesheet" href="{{ url_for('static', filename='cp.css') }}">
<title>{% block title %}控制面板{% endblock %} - {{ settings.site_name }}</title>
</head>
<body leftmargin="10" topmargin="10" marginwidth="10" marginheight="10">
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
  <p><font size="1" color="{{ '#990000' if category == 'error' else 'darkgreen' }}"><b>{{ message }}</b></font></p>
  {% endfor %}
{% endwith %}

{% block content %}{% endblock %}

<div align="center" style="font:10px Verdana,Arial,sans-serif;color:#888;padding:6px 0">Page load: {{ generation_time }} s | Template load: 0.0000 s</div>
</body>
</html>
