{% extends "admin/admin_base.html" %}
{% block title %}删除公告{% endblock %}
{% block content %}
<form method="post">
<table cellpadding="1" cellspacing="0" border="0" align="center" width="90%" class="tblborder"><tr><td>
<table cellpadding="4" cellspacing="0" border="0" width="100%">
<tr class="tblhead"><td colspan="2"><font size="1"><b><span class="tblhead">Confirm deletion</span></b></font></td></tr>
<tr class="firstalt" valign="top"><td colspan="2"><p>Are you sure you want to delete this announcement?</p></td></tr>
<tr class="secondalt" valign="top"><td colspan="2"><p>{{ announcement.title }}</p></td></tr>
<tr class="tblhead"><td colspan="2" align="center">
	<input type="hidden" name="_csrf" value="{{ csrf_token() }}">
	<input type="submit" value="Yes">
	<input type="button" value="No" onclick="history.back()">
</td></tr>
</table>
</td></tr></table>
</form>
{% endblock %}
