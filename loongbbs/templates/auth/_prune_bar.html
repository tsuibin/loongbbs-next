<tr id="cat">
	<td bgcolor="#8080A6" width="100%" colspan="7">
	<table width="100%" cellpadding="0" cellspacing="0" border="0">
	<tr>
		<td nowrap><font size="1" color="#EEEEFF"><b>{% if ui_lang == 'en' %}{{ subscriptions|length }} thread(s){% else %}共 {{ subscriptions|length }} 个主题{% endif %}</b>&nbsp;</font></td>
		<td align="right" nowrap><font size="1" color="#EEEEFF" class="thtcolor">
		<b>{% if ui_lang == 'en' %}Show threads from{% else %}显示主题范围{% endif %}</b>
		<select class="bginput" onchange="if(this.value) location.href=this.value;">
			{% for days in prune_options %}
			<option value="{{ url_for(prune_endpoint or 'auth.subscriptions', daysprune=days) }}"{% if days == daysprune %} selected{% endif %}>{% if days == 1 %}{% if ui_lang == 'en' %}last day{% else %}最近 1 天{% endif %}{% elif days == 2 %}{% if ui_lang == 'en' %}last 2 days{% else %}最近 2 天{% endif %}{% elif days == 5 %}{% if ui_lang == 'en' %}last 5 days{% else %}最近 5 天{% endif %}{% elif days == 10 %}{% if ui_lang == 'en' %}last 10 days{% else %}最近 10 天{% endif %}{% elif days == 20 %}{% if ui_lang == 'en' %}last 20 days{% else %}最近 20 天{% endif %}{% elif days == 30 %}{% if ui_lang == 'en' %}last 30 days{% else %}最近 30 天{% endif %}{% elif days == 45 %}{% if ui_lang == 'en' %}last 45 days{% else %}最近 45 天{% endif %}{% elif days == 60 %}{% if ui_lang == 'en' %}last 60 days{% else %}最近 60 天{% endif %}{% elif days == 75 %}{% if ui_lang == 'en' %}last 75 days{% else %}最近 75 天{% endif %}{% elif days == 100 %}{% if ui_lang == 'en' %}last 100 days{% else %}最近 100 天{% endif %}{% elif days == 365 %}{% if ui_lang == 'en' %}the last year{% else %}最近一年{% endif %}{% else %}{% if ui_lang == 'en' %}the beginning{% else %}全部时间{% endif %}{% endif %}</option>
			{% endfor %}
		</select></font></td>
	</tr></table>
	</td>
</tr>
