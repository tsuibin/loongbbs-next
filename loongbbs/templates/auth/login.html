{% extends "base.html" %}
{% block title %}登录 · {{ settings.site_name }}{% endblock %}
{% block content %}
<section class="card narrow">
  <header class="card-head"><h2>登录</h2></header>
  <form method="post" action="{{ url_for('auth.login') }}" class="stack-form">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label class="field"><span>用户名</span>
      <input type="text" name="username" value="{{ username or '' }}" required autofocus>
    </label>
    <label class="field"><span>密码</span>
      <input type="password" name="password" required>
    </label>
    <label class="checkbox"><input type="checkbox" name="remember" value="1"> 记住我</label>
    <button class="button" type="submit">登录</button>
  </form>
  {% if settings.allow_registration == '1' %}
    <p class="muted small">还没有账号？<a href="{{ url_for('auth.register_form') }}">注册一个</a></p>
  {% endif %}
</section>
{% endblock %}
