{% extends "base.html" %}
{% block title %}{{ settings.site_name }} - 注册{% endblock %}
{% block content %}
<table cellpadding="2" cellspacing="0" border="0" width="100%" align="center">
<tr>
	<td width="100%"><img src="{{ url_for('static', filename='images/vb_bullet.gif') }}" border="0" align="middle" alt="{{ settings.site_name }}">
	<font face="verdana, arial, helvetica" size="2"><b><a href="{{ url_for('forums.index') }}">{{ settings.site_name }}</a> &gt; 注册</b></font></td>
</tr>
</table>

<br>

<form method="post" action="{{ url_for('auth.register') }}">
<table cellpadding="0" cellspacing="0" border="0" bgcolor="#555576" width="100%" align="center"><tr><td>
<table cellpadding="4" cellspacing="1" border="0" width="100%">
<tr>
	<td bgcolor="#8080A6" colspan="2"><font face="verdana, arial, helvetica" size="2" color="#EEEEFF"><b>注册新账号</b></font></td>
</tr>
<tr bgcolor="#DFDFDF">
	<td bgcolor="#DFDFDF" width="35%"><font face="verdana, arial, helvetica" size="2"><b>用户名:</b></font></td>
	<td bgcolor="#DFDFDF"><font face="verdana, arial, helvetica" size="2"><input type="text" class="bginput" name="username" value="{{ username or '' }}" size="40"></font><br>
	<font face="verdana,arial,helvetica" size="1">{% if min_user %}{{ min_user }}–{{ max_user }} 位，{% endif %}允许中文、字母、数字和下划线</font></td>
</tr>
<tr>
	<td bgcolor="#F1F1F1"><font face="verdana, arial, helvetica" size="2"><b>邮箱地址:</b></font></td>
	<td bgcolor="#F1F1F1"><font face="verdana, arial, helvetica" size="2"><input type="text" class="bginput" name="email" value="{{ email or '' }}" size="40"></font></td>
</tr>
<tr bgcolor="#DFDFDF">
	<td bgcolor="#DFDFDF"><font face="verdana, arial, helvetica" size="2"><b>密码:</b></font></td>
	<td bgcolor="#DFDFDF"><font face="verdana, arial, helvetica" size="2"><input type="password" class="bginput" name="password" size="40"></font><br>
	<font face="verdana,arial,helvetica" size="1">至少 8 位</font></td>
</tr>
<tr>
	<td bgcolor="#F1F1F1"><font face="verdana, arial, helvetica" size="2"><b>确认密码:</b></font></td>
	<td bgcolor="#F1F1F1"><font face="verdana, arial, helvetica" size="2"><input type="password" class="bginput" name="password2" size="40"></font></td>
</tr>
<tr>
	<td bgcolor="#F1F1F1" colspan="2" align="center">
	<input type="hidden" name="_csrf" value="{{ csrf_token() }}">
	<input type="submit" class="bginput" value="提交注册">
	<input type="reset" class="bginput" value="重置">
	</td>
</tr>
</table>
</td></tr></table>
</form>
{% endblock %}
