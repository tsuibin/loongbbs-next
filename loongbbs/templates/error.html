{% extends "base.html" %}
{% block title %}{{ settings.site_name }} - {{ code }}{% endblock %}
{% block content %}
<table class="tborder auto" cellpadding="4" cellspacing="1" width="450" align="center">
<tr><td class="tcat" align="left">提示信息</td></tr>
<tr>
  <td class="alt1" align="center">
    <p><span class="normalfont bold">{{ code }} — {{ message }}</span></p>
    <p><span class="smallfont">可能的原因：链接失效、主题被删除，或你没有访问权限。</span></p>
    <p>
      <a class="btnlink" href="{{ url_for('forums.index') }}">返回论坛首页</a>
      <a class="btnlink" href="{{ url_for('search.search') }}">搜索</a>
    </p>
  </td>
</tr>
</table>
{% endblock %}
