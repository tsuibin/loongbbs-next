{% extends "base.html" %}
{% block title %}{{ settings.site_name }} - 写悄悄话{% endblock %}
{% block content %}
<table cellpadding="2" cellspacing="0" border="0" width="100%" align="center">
<tr>
	<td width="100%"><img src="{{ url_for('static', filename='images/vb_bullet.gif') }}" border="0" align="middle" alt="{{ settings.site_name }}">
	<font face="verdana, arial, helvetica" size="2"><b><a href="{{ url_for('forums.index') }}">{{ settings.site_name }}</a> &gt; 悄悄话 &gt; 写新悄悄话</b></font></td>
	<td valign="bottom" align="right" nowrap><font face="verdana,arial,helvetica" size="1">
	<a href="{{ url_for('pm.inbox') }}">收件箱</a> · <a href="{{ url_for('pm.sent') }}">已发送</a></font></td>
</tr>
</table>

<br>

<form method="post" action="{{ url_for('pm.compose') }}">
<table cellpadding="0" cellspacing="0" border="0" bgcolor="#555576" width="100%" align="center"><tr><td>
<table cellpadding="4" cellspacing="1" border="0" width="100%">
<tr>
	<td bgcolor="#8080A6" colspan="2"><font face="verdana, arial, helvetica" size="2" color="#EEEEFF"><b>发送悄悄话</b></font></td>
</tr>
<tr bgcolor="#DFDFDF">
	<td bgcolor="#DFDFDF" width="30%"><font face="verdana, arial, helvetica" size="2"><b>收件人:</b></font></td>
	<td bgcolor="#DFDFDF"><font face="verdana, arial, helvetica" size="2"><input type="text" class="bginput" name="to" value="{{ to }}" size="40"></font></td>
</tr>
<tr>
	<td bgcolor="#F1F1F1"><font face="verdana, arial, helvetica" size="2"><b>主题:</b></font></td>
	<td bgcolor="#F1F1F1"><font face="verdana, arial, helvetica" size="2"><input type="text" class="bginput" name="subject" value="{{ subject }}" size="50" maxlength="200"></font></td>
</tr>
<tr>
	<td bgcolor="#DFDFDF" valign="top"><font face="verdana, arial, helvetica" size="2"><b>消息:</b></font></td>
	<td bgcolor="#DFDFDF"><textarea name="body" rows="14" cols="70" wrap="virtual">{{ body }}</textarea></td>
</tr>
<tr>
	<td bgcolor="#F1F1F1" colspan="2" align="center">
	<input type="hidden" name="_csrf" value="{{ csrf_token() }}">
	<input type="submit" class="bginput" value="发送">
	<input type="reset" class="bginput" value="重置">
	</td>
</tr>
</table>
</td></tr></table>
</form>
{% endblock %}
