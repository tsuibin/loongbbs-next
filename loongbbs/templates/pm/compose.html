{% extends "base.html" %}
{% block title %}{{ settings.site_name }} - 写悄悄话{% endblock %}
{% block content %}
<table class="navbar" cellpadding="0" cellspacing="0">
<tr>
  <td class="crumbs"><a href="{{ url_for('forums.index') }}">{{ settings.site_name }}</a> &gt; 悄悄话 &gt; 写新悄悄话</td>
  <td class="navlinks">
    <a href="{{ url_for('pm.inbox') }}">收件箱</a><span class="sep">|</span>
    <a href="{{ url_for('pm.sent') }}">已发送</a>
  </td>
</tr>
</table>

<form method="post" action="{{ url_for('pm.compose') }}">
<table class="tborder" cellpadding="4" cellspacing="1">
<tr><td class="tcat" align="left" colspan="2">发送悄悄话</td></tr>
<tr>
  <td class="alt1" width="140" align="right"><span class="field-label">收件人:</span></td>
  <td class="alt1"><input type="text" name="to" size="30" value="{{ to }}" required></td>
</tr>
<tr>
  <td class="alt2" align="right"><span class="field-label">主题:</span></td>
  <td class="alt2"><input type="text" name="subject" size="50" maxlength="200" value="{{ subject }}" required></td>
</tr>
<tr>
  <td class="alt1" align="right" valign="top"><span class="field-label">消息:</span></td>
  <td class="alt1"><textarea name="body" rows="12" cols="70" wrap="virtual" required>{{ body }}</textarea></td>
</tr>
<tr>
  <td class="alt2" colspan="2" align="center">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <input type="submit" value="  发送  ">
    <input type="reset" value="  重置  ">
  </td>
</tr>
</table>
</form>
{% endblock %}
